name: .NET Build and test

on:
  workflow_call: # Allow to call this workflow from another
        
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore ./ToucanHub.Sdk.slnx

    - name: Test
      run: dotnet test ./ToucanHub.Sdk.slnx --verbosity normal
    
